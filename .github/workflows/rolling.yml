---
name: Rolling

on:
  workflow_dispatch:
  schedule:
    - cron: "42 * * * *"

permissions:
  contents: write

jobs:
  rolling:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: "${{ secrets.GH_APP_ID }}"
          private-key: "${{ secrets.GH_APP_PRIV_KEY }}"
      - id: get-user-id
        name: Get GitHub app user ID
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: "${{ steps.app-token.outputs.token }}"
          path: client-rust
      - name: Setup rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - name: Fetch schema
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: goauthentik/authentik
          token: "${{ steps.app-token.outputs.token }}"
          ref: "main"
          path: authentik
          sparse-checkout: |
            schema.yml
          sparse-checkout-cone-mode: false
      - name: Push
        working-directory: client-rust
        run: |
          cp ../authentik/schema.yml .
          git diff --exit-code -- schema.yml && exit 0

          version="$(cat schema.yml | yq -r .info.version)"
          make build version="$(cat schema.yml | yq -r .info.version)"
          git checkout README.md

          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

          git add .
          git commit -m "Update to https://github.com/goauthentik/authentik/commits/$(git -C ../authentik show-ref --hash HEAD)"
          git push origin main
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token }}"
          RUSTFLAGS: -Awarnings
